spring.application.name=findit

# Password alag secret file mein rahega (GitHub par nahi jayega)
spring.config.import=optional:classpath:secret.properties

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/findit_db
spring.datasource.username=root

# Hibernate tables khud bana dega / update kar dega
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true